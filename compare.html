<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Products - ASA Fashion</title><link rel="stylesheet" href="asa-premium.css"><script src="asa-core.js"></script><script type="module" src="asa-live.js"></script></head><body><header class="header"><div class="wrap"><div class="head"><a href="index.html"><img class="logo" src="logo.jpg"></a><div></div><div class="actions"><a class="iconbtn" href="checkout.html">🛒<span class="badge" data-cart-count>0</span></a></div></div></div></header><main class="wrap section"><div class="sectionHead"><h2>⇄ Product Compare</h2><a class="btn light" href="shop.html">Add More</a></div><div id="box"></div></main><script>async function init(){let p=await window.ASA_LIVE.products(),a=p.filter(x=>ASA.compare().includes(+x.id));if(!a.length){box.innerHTML='<div class="empty">Compare list খালি। Shop থেকে সর্বোচ্চ ৪টি পণ্য তুলনা করুন।</div>';return}box.innerHTML='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden">'+['Product','Category','Price','Old Price','Discount','Action'].map((h,i)=>`<tr><th style="padding:12px;text-align:left;border-bottom:1px solid #eee">${h}</th>${a.map(x=>`<td style="padding:12px;border-bottom:1px solid #eee">${i===0?x.name:i===1?x.category:i===2?ASA.money(x.price):i===3?(x.oldPrice?ASA.money(x.oldPrice):'-'):i===4?(x.oldPrice?Math.round((1-x.price/x.oldPrice)*100)+'%':'-'):`<button class='btn' onclick='ASA.add(${JSON.stringify(x)})'>Add</button>`}</td>`).join('')}</tr>`).join('')+'</table></div>'}init()</script></body></html>
