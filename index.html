<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASA Fashion Collection BD</title>
<meta name="description" content="ASA Fashion Collection BD - নারী, পুরুষ ও শিশুদের পোশাক এবং ফ্যাশন পণ্য।">
<link rel="manifest" href="manifest.json"><link rel="icon" href="logo.jpg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f7f7f8;color:#222}
header{background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0001}.top{max-width:1150px;margin:auto;padding:12px 16px;display:flex;gap:14px;align-items:center}.logo{width:52px;height:52px;border-radius:12px;object-fit:cover}.brand{font-weight:800;font-size:19px}.sub{font-size:12px;color:#777}
.search{max-width:1150px;margin:auto;padding:0 16px 12px}.search input{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:12px;font-size:15px}
nav{max-width:1150px;margin:auto;padding:0 16px 12px;display:flex;gap:8px;overflow:auto}nav button{white-space:nowrap;border:0;border-radius:20px;padding:9px 14px;background:#eee;cursor:pointer}nav button.active{background:#111;color:white}
.hero{max-width:1150px;margin:18px auto;padding:26px 18px;border-radius:18px;background:linear-gradient(120deg,#111,#333);color:#fff}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#ddd}
main{max-width:1150px;margin:auto;padding:0 16px 90px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px #00000010}.pic{height:190px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:58px}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.name{font-weight:700;min-height:40px}.cat{font-size:12px;color:#777;margin:5px 0}.price{font-size:19px;font-weight:800}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:5px}.add{width:100%;border:0;background:#111;color:#fff;padding:11px;border-radius:10px;margin-top:10px;cursor:pointer}
.cart{position:fixed;right:18px;bottom:18px;border:0;background:#111;color:#fff;padding:14px 18px;border-radius:28px;font-weight:700;box-shadow:0 5px 20px #0003;z-index:10}.badge{background:#e33;padding:3px 7px;border-radius:20px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:160px}}@media(max-width:430px){.grid{gap:9px}.pic{height:145px}.hero h1{font-size:23px}}
.account{margin-left:auto;text-decoration:none;background:#111;color:#fff;padding:10px 13px;border-radius:12px;font-weight:700;font-size:13px}.account small{opacity:.8} .top{flex-wrap:wrap}</style><style>.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:99}.bottom-nav a{text-decoration:none;color:#777;text-align:center;font-size:24px;padding-top:7px}.bottom-nav small{display:block;font-size:11px}.bottom-nav a:hover{color:#e66}</style><script src="asa-settings.js"></script></head>
<body>
<header><div class="top"><img class="logo" src="logo.jpg"><div><div class="brand" id="siteName">ASA Fashion Collection BD</div><div class="sub" id="siteSubtitle">নারী • পুরুষ • শিশু • ফ্যাশন</div></div><a class="account" id="accountBtn" href="login.html">👤 Login</a><a class="admin-link" href="admin.html" style="text-decoration:none;background:#111;color:#fff;padding:10px 13px;border-radius:12px;font-weight:700;font-size:13px;margin-left:6px">⚙️ Admin</a></div>
<div class="search"><input id="search" placeholder="পণ্য খুঁজুন..."></div><nav id="cats"></nav></header>
<section class="hero"><h1 id="heroTitle">আপনার পছন্দের ফ্যাশন এক জায়গায় 🛍️</h1><p id="heroText">শাড়ি, থ্রি-পিস, বোরকা, পাঞ্জাবি, শিশুদের পোশাকসহ আরও অনেক পণ্য।</p></section>
<main><div id="count" style="margin:12px 0;font-weight:700"></div><div id="grid" class="grid"></div></main>
<button class="cart" onclick="location.href='checkout.html'">🛒 Cart <span id="cartCount" class="badge">0</span></button>
<script>
const fallbackProducts=[{"id":1,"name":"Premium Saree Collection","category":"শাড়ি","price":1250,"oldPrice":0,"image":"","description":""},{"id":2,"name":"Elegant Designer Saree","category":"শাড়ি","price":1450,"oldPrice":0,"image":"","description":""},{"id":3,"name":"Stylish Three Piece","category":"থ্রি-পিস","price":990,"oldPrice":0,"image":"","description":""},{"id":4,"name":"Premium Three Piece","category":"থ্রি-পিস","price":1250,"oldPrice":0,"image":"","description":""},{"id":5,"name":"Elegant Burqa","category":"বোরকা","price":1100,"oldPrice":0,"image":"","description":""},{"id":6,"name":"Premium Abaya","category":"আবায়া","price":1450,"oldPrice":0,"image":"","description":""},{"id":7,"name":"Premium Panjabi","category":"পাঞ্জাবি","price":850,"oldPrice":0,"image":"","description":""},{"id":8,"name":"Stylish Panjabi","category":"পাঞ্জাবি","price":1050,"oldPrice":0,"image":"","description":""},{"id":9,"name":"Classic Men's Shirt","category":"শার্ট","price":750,"oldPrice":0,"image":"","description":""},{"id":10,"name":"Premium Polo Shirt","category":"পোলো শার্ট","price":650,"oldPrice":0,"image":"","description":""},{"id":11,"name":"Comfortable T-Shirt","category":"টি-শার্ট","price":450,"oldPrice":0,"image":"","description":""},{"id":12,"name":"Men's Jeans","category":"জিন্স","price":950,"oldPrice":0,"image":"","description":""},{"id":13,"name":"Formal Pant","category":"ফরমাল প্যান্ট","price":850,"oldPrice":0,"image":"","description":""},{"id":14,"name":"Women's Kurti","category":"কুর্তি","price":750,"oldPrice":0,"image":"","description":""},{"id":15,"name":"Stylish Gown","category":"গাউন","price":1350,"oldPrice":0,"image":"","description":""},{"id":16,"name":"Modern Lehenga","category":"লেহেঙ্গা","price":1850,"oldPrice":0,"image":"","description":""},{"id":17,"name":"Premium Hijab","category":"হিজাব","price":350,"oldPrice":0,"image":"","description":""},{"id":18,"name":"Baby Dress Set","category":"বেবি ড্রেস","price":650,"oldPrice":0,"image":"","description":""},{"id":19,"name":"Girls Frock","category":"ফ্রক","price":750,"oldPrice":0,"image":"","description":""},{"id":20,"name":"Kids Panjabi Set","category":"বাচ্চাদের পাঞ্জাবি","price":700,"oldPrice":0,"image":"","description":""},{"id":21,"name":"Kids T-Shirt","category":"বাচ্চাদের টি-শার্ট","price":350,"oldPrice":0,"image":"","description":""},{"id":22,"name":"Kids Jeans","category":"বাচ্চাদের জিন্স","price":650,"oldPrice":0,"image":"","description":""},{"id":23,"name":"Fashion Handbag","category":"ব্যাগ","price":850,"oldPrice":0,"image":"","description":""},{"id":24,"name":"Ladies Vanity Bag","category":"ভ্যানিটি ব্যাগ","price":950,"oldPrice":0,"image":"","description":""},{"id":25,"name":"Fashion Watch","category":"ঘড়ি","price":650,"oldPrice":0,"image":"","description":""},{"id":26,"name":"Stylish Sunglasses","category":"সানগ্লাস","price":450,"oldPrice":0,"image":"","description":""},{"id":27,"name":"Fashion Necklace","category":"নেকলেস","price":550,"oldPrice":0,"image":"","description":""},{"id":28,"name":"Bracelet","category":"ব্রেসলেট","price":350,"oldPrice":0,"image":"","description":""}];;
let products=fallbackProducts;
const cats=["সব পণ্য", "মহিলাদের পোশাক", "পুরুষদের পোশাক", "বাচ্চাদের পোশাক", "ফ্যাশন ও অ্যাক্সেসরিজ"];
const groups={"সব পণ্য":[],"মহিলাদের পোশাক":["শাড়ি","থ্রি-পিস","টু-পিস","সালোয়ার-কামিজ","কুর্তি","গাউন","লেহেঙ্গা","কাফতান","টপস","স্কার্ট","জিন্স","পালাজ্জো","নাইটি","বোরকা","আবায়া","হিজাব","নিকাব"],"পুরুষদের পোশাক":["পাঞ্জাবি","শার্ট","টি-শার্ট","পোলো শার্ট","জিন্স","গ্যাবার্ডিন প্যান্ট","ফরমাল প্যান্ট","লুঙ্গি","পায়জামা","শেরওয়ানি","কাবলি সেট","ফতুয়া","ব্লেজার","জ্যাকেট","সোয়েটার","হুডি","শর্টস"],"বাচ্চাদের পোশাক":["ছেলেদের সেট","মেয়েদের সেট","বেবি ড্রেস","ফ্রক","বাচ্চাদের পাঞ্জাবি","বাচ্চাদের শার্ট","বাচ্চাদের টি-শার্ট","বাচ্চাদের প্যান্ট","বাচ্চাদের জিন্স","বাচ্চাদের গাউন","বাচ্চাদের লেহেঙ্গা","স্কুল ড্রেস"],"ফ্যাশন ও অ্যাক্সেসরিজ":["ব্যাগ","ভ্যানিটি ব্যাগ","ওয়ালেট","বেল্ট","ক্যাপ","স্কার্ফ","সানগ্লাস","ঘড়ি","জুয়েলারি","কানের দুল","নেকলেস","ব্রেসলেট","রিং","চুড়ি","হেয়ার অ্যাক্সেসরিজ"]};
let selected='সব পণ্য';const catsEl=document.getElementById('cats');const cart=JSON.parse(localStorage.getItem('asa_cart')||'[]');const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function drawCats(){catsEl.innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===selected?'active':'';b.onclick=()=>{selected=c;drawCats();draw()};catsEl.appendChild(b)})}
function draw(){const q=document.getElementById('search').value.toLowerCase();let list=products.filter(p=>(selected==='সব পণ্য'||groups[selected].includes(p.category))&&((p.name+' '+p.category).toLowerCase().includes(q)));document.getElementById('count').textContent=list.length+'টি পণ্য';document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><div class="pic">${p.image?`<img src="${esc(p.image)}" onerror="this.style.display='none'">`:'👗'}</div><div class="info"><a href="product.html?id=${p.id}" class="name" style="display:block;color:#222;text-decoration:none">${esc(p.name)}</a><div class="cat">${esc(p.category)}</div><div class="price">৳${p.price}${p.oldPrice?` <span class="old">৳${p.oldPrice}</span>`:''}</div><button class="add" onclick="add(${p.id})">🛒 Add to Cart</button><a href="product.html?id=${p.id}" style="display:block;text-align:center;margin-top:7px;text-decoration:none;color:#555;font-size:13px">Product Details →</a></div></div>`).join('')}
function add(id){const x=cart.find(a=>a.id===id);x?x.qty++:cart.push({id,qty:1});localStorage.setItem('asa_cart',JSON.stringify(cart));updateCart();alert('Cart-এ যোগ হয়েছে')}
function updateCart(){document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function updateAccount(){const u=JSON.parse(localStorage.getItem('asa_user')||'null');const b=document.getElementById('accountBtn');if(u){b.href='account.html';b.innerHTML='👤 '+esc(u.name||'Account')}else{b.href='login.html';b.textContent='👤 Login'}}
fetch('products.json?'+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(x=>{if(Array.isArray(x)){products=x;draw()}}).catch(()=>{});document.getElementById('search').oninput=draw;drawCats();draw();updateCart();updateAccount();
</script><nav class="bottom-nav"><a href="index.html">⌂<small>Home</small></a><a href="messages.html">💬<small>Messages</small></a><a href="checkout.html">🛒<small>Cart</small></a><a href="account.html">♙<small>Account</small></a></nav><script>(async()=>{let s=await loadASASettings();for(let [id,k] of [["siteName","siteName"],["siteSubtitle","subtitle"],["heroTitle","heroTitle"],["heroText","heroText"]]){let e=document.getElementById(id);if(e)e.textContent=s[k]}let q=document.getElementById("search");if(q)q.placeholder=s.searchPlaceholder||q.placeholder;let a=document.querySelector(".admin-link");if(a)a.textContent=s.adminLabel||a.textContent;let l=document.querySelectorAll(".bottom-nav small");[s.homeLabel,s.messagesNav,s.cartNav,s.accountNav].forEach((x,i)=>{if(l[i])l[i].textContent=x});document.querySelectorAll(".logo").forEach(x=>x.src=s.logo||x.src)})()</script></body></html>
