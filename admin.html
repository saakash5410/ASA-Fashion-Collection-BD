<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASA Fashion Editor</title>
<style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f5f5;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.panel{background:#fff;padding:18px;border-radius:15px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0 10px}button{padding:10px 14px;border:0;border-radius:9px;background:#111;color:#fff;margin:3px;cursor:pointer}.del{background:#b11}.item{border:1px solid #eee;padding:10px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.muted{color:#777;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h2>⚙️ ASA Fashion Product Editor</h2><div class="panel"><h3>নতুন Product যোগ করুন</h3><div class="grid"><div><label>নাম</label><input id="n"></div><div><label>Category</label><select id="c"></select></div><div><label>Price</label><input id="p" type="number"></div><div><label>Old Price</label><input id="o" type="number"></div></div><label>Image URL (optional)</label><input id="i" placeholder="https://..."><button onclick="add()">➕ Add Product</button><button onclick="download()">💾 Download products.json</button></div><div class="panel"><h3>Product List</h3><div id="list"></div></div><p class="muted">নোট: GitHub Pages-এ এই editor-এর পরিবর্তন live site-এ নিতে নতুন products.json ফাইল download করে GitHub-এ upload/replace করতে হবে।</p></div>
<script>
const defaults=[{"id":1,"name":"Premium Saree Collection","category":"শাড়ি","price":1250,"oldPrice":0,"image":"","description":""},{"id":2,"name":"Elegant Designer Saree","category":"শাড়ি","price":1450,"oldPrice":0,"image":"","description":""},{"id":3,"name":"Stylish Three Piece","category":"থ্রি-পিস","price":990,"oldPrice":0,"image":"","description":""},{"id":4,"name":"Premium Three Piece","category":"থ্রি-পিস","price":1250,"oldPrice":0,"image":"","description":""},{"id":5,"name":"Elegant Burqa","category":"বোরকা","price":1100,"oldPrice":0,"image":"","description":""},{"id":6,"name":"Premium Abaya","category":"আবায়া","price":1450,"oldPrice":0,"image":"","description":""},{"id":7,"name":"Premium Panjabi","category":"পাঞ্জাবি","price":850,"oldPrice":0,"image":"","description":""},{"id":8,"name":"Stylish Panjabi","category":"পাঞ্জাবি","price":1050,"oldPrice":0,"image":"","description":""},{"id":9,"name":"Classic Men's Shirt","category":"শার্ট","price":750,"oldPrice":0,"image":"","description":""},{"id":10,"name":"Premium Polo Shirt","category":"পোলো শার্ট","price":650,"oldPrice":0,"image":"","description":""},{"id":11,"name":"Comfortable T-Shirt","category":"টি-শার্ট","price":450,"oldPrice":0,"image":"","description":""},{"id":12,"name":"Men's Jeans","category":"জিন্স","price":950,"oldPrice":0,"image":"","description":""},{"id":13,"name":"Formal Pant","category":"ফরমাল প্যান্ট","price":850,"oldPrice":0,"image":"","description":""},{"id":14,"name":"Women's Kurti","category":"কুর্তি","price":750,"oldPrice":0,"image":"","description":""},{"id":15,"name":"Stylish Gown","category":"গাউন","price":1350,"oldPrice":0,"image":"","description":""},{"id":16,"name":"Modern Lehenga","category":"লেহেঙ্গা","price":1850,"oldPrice":0,"image":"","description":""},{"id":17,"name":"Premium Hijab","category":"হিজাব","price":350,"oldPrice":0,"image":"","description":""},{"id":18,"name":"Baby Dress Set","category":"বেবি ড্রেস","price":650,"oldPrice":0,"image":"","description":""},{"id":19,"name":"Girls Frock","category":"ফ্রক","price":750,"oldPrice":0,"image":"","description":""},{"id":20,"name":"Kids Panjabi Set","category":"বাচ্চাদের পাঞ্জাবি","price":700,"oldPrice":0,"image":"","description":""},{"id":21,"name":"Kids T-Shirt","category":"বাচ্চাদের টি-শার্ট","price":350,"oldPrice":0,"image":"","description":""},{"id":22,"name":"Kids Jeans","category":"বাচ্চাদের জিন্স","price":650,"oldPrice":0,"image":"","description":""},{"id":23,"name":"Fashion Handbag","category":"ব্যাগ","price":850,"oldPrice":0,"image":"","description":""},{"id":24,"name":"Ladies Vanity Bag","category":"ভ্যানিটি ব্যাগ","price":950,"oldPrice":0,"image":"","description":""},{"id":25,"name":"Fashion Watch","category":"ঘড়ি","price":650,"oldPrice":0,"image":"","description":""},{"id":26,"name":"Stylish Sunglasses","category":"সানগ্লাস","price":450,"oldPrice":0,"image":"","description":""},{"id":27,"name":"Fashion Necklace","category":"নেকলেস","price":550,"oldPrice":0,"image":"","description":""},{"id":28,"name":"Bracelet","category":"ব্রেসলেট","price":350,"oldPrice":0,"image":"","description":""}];let data=JSON.parse(localStorage.getItem('asa_products')||'null')||defaults;const cats=["সব পণ্য", "মহিলাদের পোশাক", "পুরুষদের পোশাক", "বাচ্চাদের পোশাক", "ফ্যাশন ও অ্যাক্সেসরিজ"].flatMap(x=>{"সব পণ্য":[],"মহিলাদের পোশাক":["শাড়ি","থ্রি-পিস","টু-পিস","সালোয়ার-কামিজ","কুর্তি","গাউন","লেহেঙ্গা","কাফতান","টপস","স্কার্ট","জিন্স","পালাজ্জো","নাইটি","বোরকা","আবায়া","হিজাব","নিকাব"],"পুরুষদের পোশাক":["পাঞ্জাবি","শার্ট","টি-শার্ট","পোলো শার্ট","জিন্স","গ্যাবার্ডিন প্যান্ট","ফরমাল প্যান্ট","লুঙ্গি","পায়জামা","শেরওয়ানি","কাবলি সেট","ফতুয়া","ব্লেজার","জ্যাকেট","সোয়েটার","হুডি","শর্টস"],"বাচ্চাদের পোশাক":["ছেলেদের সেট","মেয়েদের সেট","বেবি ড্রেস","ফ্রক","বাচ্চাদের পাঞ্জাবি","বাচ্চাদের শার্ট","বাচ্চাদের টি-শার্ট","বাচ্চাদের প্যান্ট","বাচ্চাদের জিন্স","বাচ্চাদের গাউন","বাচ্চাদের লেহেঙ্গা","স্কুল ড্রেস"],"ফ্যাশন ও অ্যাক্সেসরিজ":["ব্যাগ","ভ্যানিটি ব্যাগ","ওয়ালেট","বেল্ট","ক্যাপ","স্কার্ফ","সানগ্লাস","ঘড়ি","জুয়েলারি","কানের দুল","নেকলেস","ব্রেসলেট","রিং","চুড়ি","হেয়ার অ্যাক্সেসরিজ"]}[x]||[]).filter((x,i,a)=>a.indexOf(x)===i);
document.getElementById('c').innerHTML=cats.map(x=>`<option>${x}</option>`).join('');
function save(){localStorage.setItem('asa_products',JSON.stringify(data));render()}
function add(){let n=document.getElementById('n').value,p=+document.getElementById('p').value;if(!n||!p)return alert('নাম ও Price দিন');data.push({id:Date.now(),name:n,category:document.getElementById('c').value,price:p,oldPrice:+document.getElementById('o').value||0,image:document.getElementById('i').value||'',description:''});save();['n','p','o','i'].forEach(x=>document.getElementById(x).value='')}
function remove(id){data=data.filter(x=>x.id!==id);save()}
function render(){document.getElementById('list').innerHTML=data.map(p=>`<div class="item"><div><b>${p.name}</b><div class="muted">${p.category} • ৳${p.price}</div></div><button class="del" onclick="remove(${p.id})">Delete</button></div>`).join('')}
function download(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='products.json';a.click()}
render();
</script></body></html>
