<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7f0b38"><title>Product Details - ASA Fashion</title><link rel="stylesheet" href="asa-premium.css"><script src="asa-core.js"></script><script type="module" src="asa-live.js"></script></head><body><div class="top">🚚 ঢাকা ৳100 • বাইরে ৳250 | 💵 Cash on Delivery</div><header class="header"><div class="wrap"><div class="head"><a href="index.html"><img class="logo" src="logo.jpg"></a><form class="search" onsubmit="return search()"><input id="q" placeholder="Search Product..."><button>🔍</button></form><div class="actions"><a class="iconbtn" href="wishlist.html">♡<span class="badge" data-wish-count>0</span></a><a class="iconbtn" href="checkout.html">🛒<span class="badge" data-cart-count>0</span></a></div></div></div></header><main class="wrap section"><div id="detail"></div><section class="section"><div class="sectionHead"><h2>Related Products</h2><a class="view" href="shop.html">View More</a></div><div class="products" id="related"></div></section><section class="section"><div class="sectionHead"><h2>Recently Viewed</h2></div><div class="products" id="recent"></div></section></main><footer class="footer"><div class="wrap footgrid"><div><img class="logo" src="logo.jpg"><p>ASA Fashion Collection BD</p></div><div><h3>Useful Link</h3><a href="shop.html">Shop</a><a href="track-order.html">Track Order</a></div><div><h3>Support</h3><a href="faq.html">FAQ</a><a href="contact.html">Contact</a></div><div><h3>Delivery</h3><p>ঢাকা ৳100 • বাইরে ৳250</p><p>COD available</p></div></div></footer><script>
let P=[],p,qty=1,size='',color='';const icons={'শাড়ি':'🥻','থ্রি-পিস':'👗','বোরকা':'🧕','আবায়া':'🧕','পাঞ্জাবি':'🧥','শার্ট':'👔','টি-শার্ট':'👕','জিন্স':'👖','কুর্তি':'👗','গাউন':'👗','লেহেঙ্গা':'👗','হিজাব':'🧕','বেবি ড্রেস':'🧸','ফ্রক':'👗','ব্যাগ':'👜','ঘড়ি':'⌚'};
function search(){location.href='shop.html?search='+encodeURIComponent(document.getElementById('q').value);return false}function setSize(x,b){size=x;document.querySelectorAll('.sizechip').forEach(e=>e.classList.remove('sel'));b.classList.add('sel')}function setColor(x,b){color=x;document.querySelectorAll('.colorchip').forEach(e=>e.classList.remove('sel'));b.classList.add('sel')}function add(buy=false){ASA.add(p,qty,{size,color});if(buy)location.href='checkout.html'}function relatedCard(x){return `<article class="card"><div class="pic">${x.image?`<img src="${x.image}">`:`<div class="placeholder">${icons[x.category]||'🛍️'}</div>`}</div><div class="cardbody"><a class="name" href="product.html?id=${x.id}">${ASA.escape(x.name)}</a><div><span class="price">${ASA.money(x.price)}</span></div><button class="btn" style="width:100%;margin-top:8px" onclick='ASA.add(${JSON.stringify(x)})'>🛒 Add to Cart</button></div></article>`}
function render(){let sale=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;let recent=JSON.parse(localStorage.getItem('asa_recent')||'[]').filter(id=>id!==p.id);recent.unshift(p.id);localStorage.setItem('asa_recent',JSON.stringify(recent.slice(0,8)));document.getElementById('detail').innerHTML=`<div class="detail"><div class="gallery"><div class="thumbs"><div class="thumb" onclick="mainPic('')"><div style="display:grid;place-items:center;height:100%;font-size:34px">${icons[p.category]||'🛍️'}</div></div></div><div class="mainimg" id="mainImg">${p.image?`<img src="${p.image}" alt="${ASA.escape(p.name)}">`:`<div class="placeholder">${icons[p.category]||'🛍️'}</div>`}</div></div><div><div class="muted">${ASA.escape(p.category)}</div><h1>${ASA.escape(p.name)}</h1><div class="stars">★★★★★ <span class="muted">(0 Reviews)</span></div><div><span class="price" style="font-size:30px">${ASA.money(p.price)}</span>${p.oldPrice?`<span class="old">${ASA.money(p.oldPrice)}</span> <span class="sale" style="position:static;display:inline-block">${sale}% OFF</span>`:''}</div><p>${ASA.escape(p.description||'Premium quality product. বিস্তারিত তথ্যের জন্য customer care-এ যোগাযোগ করুন।')}</p><hr><b>Size</b><div class="variant">${['S','M','L','XL','XXL'].map(x=>`<button class="chip sizechip" onclick="setSize('${x}',this)">${x}</button>`).join('')}</div><b>Color</b><div class="variant">${['Black','White','Maroon','Blue'].map(x=>`<button class="chip colorchip" onclick="setColor('${x}',this)">${x}</button>`).join('')}</div><b>Quantity</b><div class="qty"><button onclick="qty=Math.max(1,qty-1);document.getElementById('qn').textContent=qty">−</button><span id="qn">1</span><button onclick="qty++;document.getElementById('qn').textContent=qty">+</button></div><div class="stickyBuy"><button class="btn" onclick="add(false)">🛒 Add to Cart</button><button class="btn gold" onclick="add(true)">⚡ Order Now</button></div><div class="infoGrid" style="margin-top:12px"><div class="infoBox">🚚 <b>Delivery</b><br><span class="muted">ঢাকা ৳100 • বাইরে ৳250</span></div><div class="infoBox">💵 <b>Payment</b><br><span class="muted">Cash on Delivery</span></div><div class="infoBox">💬 <b>Support</b><br><span class="muted">01626201990</span></div></div><p><a class="btn light" href="tel:01626201990">📞 Call</a> <a class="btn light" href="https://wa.me/8801626201990">WhatsApp</a> <button class="btn light" onclick="navigator.share?navigator.share({title:p.name,url:location.href}):ASA.toast('Link copied');navigator.clipboard?.writeText(location.href)">↗ Share</button></p></div></div>`;let rel=P.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,5);document.getElementById('related').innerHTML=rel.map(relatedCard).join('')||P.filter(x=>x.id!==p.id).slice(0,5).map(relatedCard).join('');document.getElementById('recent').innerHTML=P.filter(x=>recent.includes(x.id)).slice(0,5).map(relatedCard).join('')||'<div class="empty">Recently viewed এখনো নেই।</div>'}
async function init(){P=await window.ASA_LIVE.products();let id=Number(new URLSearchParams(location.search).get('id')||1);p=P.find(x=>x.id===id)||P[0];render()}init();
</script></body></html>
