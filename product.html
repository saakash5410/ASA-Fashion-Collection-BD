<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details - ASA Fashion</title><style>body{margin:0;background:#f6f6f6;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#222}.box{max-width:900px;margin:18px auto 85px;background:#fff;border-radius:18px;padding:18px}.product{display:grid;grid-template-columns:1fr 1fr;gap:22px}.photo{min-height:330px;background:#eee;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.price{font-size:28px;font-weight:800}.old{text-decoration:line-through;color:#999;font-size:16px;margin-left:8px}.add,button{border:0;background:#111;color:#fff;padding:13px 18px;border-radius:11px;font-weight:700;margin-top:12px}.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rec a{background:#f5f5f5;border-radius:12px;padding:12px;text-decoration:none;color:#222}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:99}.bottom-nav a{text-decoration:none;color:#777;text-align:center;font-size:24px;padding-top:7px}.bottom-nav small{display:block;font-size:11px}@media(max-width:650px){.product{grid-template-columns:1fr}.rec{grid-template-columns:1fr 1fr}.photo{min-height:260px}}</style><script src="asa-settings.js"></script></head><body><div class="box"><p><a href="index.html">← Home</a></p><div id="view"></div><hr><h2>⭐ Ratings & Reviews</h2><div id="reviews"></div><h2>🛍️ Recommendations</h2><div class="rec" id="rec"></div></div><script>let products=[];const id=Number(new URLSearchParams(location.search).get('id'));fetch('products.json?'+Date.now()).then(r=>r.json()).then(x=>{products=x;render()}).catch(()=>render());function render(){const p=products.find(x=>x.id===id)||products[0];if(!p)return;document.title=p.name+' - ASA Fashion';document.getElementById('view').innerHTML=`<div class="product"><div class="photo">${p.image?`<img src="${p.image}" onerror="this.style.display='none'">`:'👗'}</div><div><h1>${p.name}</h1><p>Category: ${p.category}</p><div class="price">৳${p.price}${p.oldPrice?` <span class="old">৳${p.oldPrice}</span>`:''}</div><p>${p.description||'এই পণ্যের জন্য বিস্তারিত তথ্য শিগগিরই যোগ করা হবে।'}</p><button onclick="add(${p.id})">🛒 Add to Cart</button></div></div>`;const rr=JSON.parse(localStorage.getItem('asa_reviews')||'[]').filter(r=>r.productId===p.id);document.getElementById('reviews').innerHTML=rr.length?rr.map(r=>`<div>⭐ ${r.rating}/5 — ${r.text||'No comment'}</div>`).join(''):'<p>এখনও কোনো review নেই।</p>';document.getElementById('rec').innerHTML=products.filter(x=>x.id!==p.id&&x.category===p.category).slice(0,6).map(x=>`<a href="product.html?id=${x.id}">${x.image?`<img src="${x.image}" style="width:100%;height:110px;object-fit:cover;border-radius:8px">`:''}<b>${x.name}</b><br>৳${x.price}</a>`).join('')||products.filter(x=>x.id!==p.id).slice(0,6).map(x=>`<a href="product.html?id=${x.id}"><b>${x.name}</b><br>৳${x.price}</a>`).join('')}function add(id){let c=JSON.parse(localStorage.getItem('asa_cart')||'[]');let x=c.find(a=>a.id===id);x?x.qty++:c.push({id,qty:1});localStorage.setItem('asa_cart',JSON.stringify(c));alert('Cart-এ যোগ হয়েছে')} </script><nav class="bottom-nav"><a href="index.html">⌂<small>Home</small></a><a href="messages.html">💬<small>Messages</small></a><a href="checkout.html">🛒<small>Cart</small></a><a href="account.html">♙<small>Account</small></a></nav><script>loadASASettings().then(s=>{document.querySelectorAll(".logo").forEach(x=>x.src=s.logo||x.src);document.querySelectorAll(".bottom-nav small").forEach((x,i)=>x.textContent=[s.homeLabel,s.messagesNav,s.cartNav,s.accountNav][i]||x.textContent);let d=document.getElementById("deliveryDhaka");if(d)d.textContent=s.deliveryDhaka;let o=document.getElementById("deliveryOutside");if(o)o.textContent=s.deliveryOutside})</script></body></html>
