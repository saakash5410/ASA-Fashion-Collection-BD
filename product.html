<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details - ASA Fashion</title><script src="asa-settings.js"></script><style>
:root{--brand:#7f0b38;--gold:#f4b52e;--bg:#f5f5f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Bengali",sans-serif;color:#19171b}.top{background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee}.topin{max-width:1100px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:12px;object-fit:cover}.top h2{font-size:16px;margin:0}.top small{color:#888}.home{margin-left:auto;background:var(--brand);color:#fff;padding:9px 13px;border-radius:8px;font-size:11px}.box{max-width:1100px;margin:14px auto 90px}.crumb{font-size:11px;color:#777;margin:10px 3px}.product{background:#fff;border-radius:18px;padding:18px;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;box-shadow:0 2px 12px #00000008}.photo{min-height:470px;border-radius:16px;background:linear-gradient(145deg,#f0f0f2,#fff);display:grid;place-items:center;overflow:hidden;font-size:100px}.photo img{width:100%;height:100%;object-fit:cover}.info h1{font-size:27px;line-height:1.25;margin:4px 0 8px}.cat{color:#777;font-size:12px}.price{color:var(--brand);font-size:30px;font-weight:900;margin:15px 0}.old{text-decoration:line-through;color:#999;font-size:15px;margin-left:8px;font-weight:400}.save{display:inline-block;background:#fff0f3;color:var(--brand);padding:5px 8px;border-radius:6px;font-size:10px;margin-left:5px}.stars{color:#e4a500;font-size:14px}.desc{color:#666;line-height:1.7;font-size:12px;border-top:1px solid #eee;border-bottom:1px solid #eee;padding:14px 0}.sizes{display:flex;gap:7px;flex-wrap:wrap}.size{border:1px solid #ddd;background:#fff;border-radius:7px;padding:8px 11px;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn{border:0;border-radius:9px;padding:13px;font-weight:800;cursor:pointer}.cart{background:#fff;color:var(--brand);border:1px solid var(--brand)}.buy{background:var(--brand);color:#fff}.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.contact a{text-align:center;padding:9px;border-radius:8px;color:#fff;font-size:11px}.call{background:#327cf6}.wa{background:#1fc66b}.msg{background:#a13ee7}.section{background:#fff;border-radius:16px;padding:15px;margin-top:14px}.rec{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.rec a{border:1px solid #eee;border-radius:10px;padding:8px;font-size:11px}.rec img{width:100%;height:140px;object-fit:cover;border-radius:8px}.bottom{position:fixed;left:0;right:0;bottom:0;height:65px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.bottom a{text-align:center;color:#666;padding-top:7px;font-size:20px}.bottom small{display:block;font-size:10px}@media(max-width:700px){.box{margin:8px 10px 80px}.product{grid-template-columns:1fr;padding:12px}.photo{min-height:300px}.info h1{font-size:22px}.price{font-size:26px}.rec{grid-template-columns:repeat(2,1fr)}.rec img{height:125px}}
</style></head><body><header class="top"><div class="topin"><img class="logo" src="logo.jpg"><div><h2>ASA Fashion Collection BD</h2><small>Product Details</small></div><a class="home" href="index.html">← Shopping</a></div></header><main class="box"><div class="crumb">Home / Product Details</div><div id="view"></div><section class="section"><h3>⭐ Ratings & Reviews</h3><div id="reviews"></div></section><section class="section"><h3>🛍️ You may also like</h3><div class="rec" id="rec"></div></section></main><nav class="bottom"><a href="index.html">⌂<small>Home</small></a><a href="messages.html">💬<small>Messages</small></a><a href="checkout.html">🛒<small>Cart</small></a><a href="account.html">♙<small>Account</small></a></nav><script>
let products=[];const id=Number(new URLSearchParams(location.search).get('id'));function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function add(id){let c=JSON.parse(localStorage.getItem('asa_cart')||'[]'),x=c.find(a=>a.id===id);x?x.qty++:c.push({id,qty:1});localStorage.setItem('asa_cart',JSON.stringify(c));alert('Cart-এ যোগ হয়েছে 🛒')}function render(){let p=products.find(x=>x.id===id)||products[0];if(!p)return;document.title=p.name+' - ASA Fashion';let disc=p.oldPrice?Math.round((1-p.price/p.oldPrice)*100):0;document.getElementById('view').innerHTML=`<article class="product"><div class="photo">${p.image?`<img src="${esc(p.image)}" onerror="this.remove()">`:'🛍️'}</div><div class="info"><div class="cat">${esc(p.category)}</div><h1>${esc(p.name)}</h1><div class="stars">★★★★★ <span style="color:#999;font-size:10px"> 0 reviews</span></div><div class="price">৳${p.price}${p.oldPrice?` <span class="old">৳${p.oldPrice}</span><span class="save">${disc}% OFF</span>`:''}</div><div class="desc">${esc(p.description||'Premium quality product. বিস্তারিত তথ্য ও available options অর্ডারের সময় জানানো হবে।')}</div><p style="font-size:12px;font-weight:700">Size</p><div class="sizes"><span class="size">M-40</span><span class="size">L-42</span><span class="size">XL-44</span><span class="size">XXL-46</span></div><div class="actions"><button class="btn cart" onclick="add(${p.id})">🛒 কার্টে যোগ করুন</button><button class="btn buy" onclick="add(${p.id});location.href='checkout.html'">⚡ এখনই অর্ডার</button></div><div class="contact"><a class="call" href="tel:01626201990">☎ Call</a><a class="wa" href="https://wa.me/8801626201990" target="_blank">WhatsApp</a><a class="msg" href="https://m.me/asafashioncollectionbd" target="_blank">Messenger</a></div><p style="font-size:11px;color:#777">🚚 ঢাকা ৳100 • ঢাকার বাইরে ৳250 • 💵 Cash on Delivery</p></div></article>`;let rr=JSON.parse(localStorage.getItem('asa_reviews')||'[]').filter(r=>r.productId===p.id);document.getElementById('reviews').innerHTML=rr.length?rr.map(r=>`<p style="font-size:12px">⭐ ${r.rating}/5 — ${esc(r.text||'No comment')}</p>`).join(''):'<p style="font-size:12px;color:#888">এখনও কোনো review নেই।</p>';let rec=products.filter(x=>x.id!==p.id&&x.category===p.category).slice(0,5);if(!rec.length)rec=products.filter(x=>x.id!==p.id).slice(0,5);document.getElementById('rec').innerHTML=rec.map(x=>`<a href="product.html?id=${x.id}">${x.image?`<img src="${esc(x.image)}">`:`<div style="height:140px;display:grid;place-items:center;font-size:45px;background:#f5f5f5;border-radius:8px">🛍️</div>`}<b>${esc(x.name)}</b><br><span style="color:#7f0b38;font-weight:800">৳${x.price}</span></a>`).join('')}
fetch('products.json?'+Date.now()).then(r=>r.json()).then(x=>{products=x;render()}).catch(()=>{});loadASASettings().then(s=>{if(s.logo)document.querySelectorAll('.logo').forEach(x=>x.src=s.logo)})
</script></body></html>
