<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order - ASA Fashion</title><link rel="stylesheet" href="asa-premium.css"><script src="asa-core.js"></script></head><body><header class="header"><div class="wrap"><div class="head"><a href="index.html"><img class="logo" src="logo.jpg"></a><div class="search"><input placeholder="Order ID দিয়ে খুঁজুন" id="quickId"><button onclick="track()">🔍</button></div><div class="actions"><a class="iconbtn" href="account.html">👤</a><a class="iconbtn" href="checkout.html">🛒<span class="badge" data-cart-count>0</span></a></div></div></div></header><main class="wrap"><div class="track"><h2>🚚 Track Your Order</h2><p class="muted">Checkout করার পর পাওয়া Order ID দিন।</p><form onsubmit="event.preventDefault();track()"><input id="id" required placeholder="যেমন ASA-1723456789" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:10px"><button class="btn" style="margin-top:10px">Track Order</button></form><div id="out" style="margin-top:20px"></div></div></main><script>function track(){let id=(document.getElementById('id').value||document.getElementById('quickId').value).trim(),orders=JSON.parse(localStorage.getItem('asa_orders')||'[]'),o=orders.find(x=>String(x.id||x.orderId).toLowerCase()===id.toLowerCase());if(!o){document.getElementById('out').innerHTML='<div class="notice">এই browser-এ Order ID পাওয়া যায়নি। Admin/Firebase order tracking চালু থাকলে support-এ যোগাযোগ করুন: 01626201990</div>';return}let st=o.status||'Pending',steps=['Pending','Confirmed','Shipped','Delivered'],idx=Math.max(0,steps.indexOf(st));document.getElementById('out').innerHTML=`<h3>Order ${ASA.escape(id)}</h3><div class="trackbar">${steps.map((s,i)=>`<div class="step ${i<=idx?'done':''}">${i<=idx?'✓ ':''}${s}</div>`).join('')}</div><p><b>Total:</b> ${ASA.money(o.total||0)}</p><p class="muted">Customer: ${ASA.escape(o.name||'')}</p>`}</script></body></html>
