<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist - ASA Fashion</title><link rel="stylesheet" href="asa-premium.css"><script src="asa-core.js"></script></head><body><header class="header"><div class="wrap"><div class="head"><a href="index.html"><img class="logo" src="logo.jpg"></a><div></div><div class="actions"><a class="iconbtn" href="checkout.html">🛒<span class="badge" data-cart-count>0</span></a></div></div></div></header><main class="wrap section"><div class="sectionHead"><h2>♡ My Wishlist</h2><a class="btn light" href="shop.html">Continue Shopping</a></div><div class="products" id="grid"></div></main><script>async function init(){let p=await fetch('products.json').then(r=>r.json()),w=ASA.wish(),a=p.filter(x=>w.includes(+x.id));document.getElementById('grid').innerHTML=a.map(x=>`<article class="card"><div class="pic">${x.image?`<img src="${x.image}">`:`<div class="placeholder">🛍️</div>`}</div><div class="cardbody"><a class="name" href="product.html?id=${x.id}">${ASA.escape(x.name)}</a><div><span class="price">${ASA.money(x.price)}</span></div><div class="cardActions"><button class="btn" onclick='ASA.add(${JSON.stringify(x)})'>🛒 Add to Cart</button><button class="btn quick" onclick="ASA.toggleWish(${x.id});init()">×</button></div></div></article>`).join('')||'<div class="empty">Wishlist এখনো খালি।<br><br><a class="btn" href="shop.html">Shop Now</a></div>'}init()</script></body></html>
