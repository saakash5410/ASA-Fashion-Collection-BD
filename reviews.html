<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews & Ratings - ASA Fashion</title><style>body{margin:0;background:#f6f6f6;font-family:Arial,"Noto Sans Bengali",sans-serif}.box{max-width:680px;margin:20px auto 80px;background:#fff;padding:20px;border-radius:18px}.review{border:1px solid #eee;padding:14px;border-radius:14px;margin:12px 0}.stars button{font-size:25px;background:none;color:#f4a400;padding:4px;border:0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0 12px}button.save{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:99}.bottom-nav a{text-decoration:none;color:#777;text-align:center;font-size:24px;padding-top:7px}.bottom-nav small{display:block;font-size:11px}</style><script src="asa-settings.js"></script><script src="asa-2026.js"></script></head><body><div class="box"><p><a href="orders.html">← My Orders</a></p><h2>⭐ Review & Ratings</h2><div id="items"></div><h3>আপনার Review</h3><div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div><textarea id="text" rows="4" placeholder="আপনার মতামত লিখুন..."></textarea><button class="save" onclick="save()">Submit Review</button><div id="done"></div></div><script>let rating=0;const params=new URLSearchParams(location.search);const oid=params.get('order');const orders=JSON.parse(localStorage.getItem('asa_orders')||'[]');const o=orders.find(x=>String(x.id)===String(oid));document.getElementById('items').innerHTML=o?o.items.map(i=>`<div class="review"><b>${i.name}</b><br>Quantity: ${i.qty}</div>`).join(''):'<p>অর্ডার নির্বাচন করা হয়নি।</p>';document.querySelectorAll('#stars').forEach(e=>e.onclick=()=>{});document.getElementById('stars').innerHTML=[1,2,3,4,5].map(n=>`<button onclick="rate(${n})">☆</button>`).join('');function rate(n){rating=n;document.getElementById('stars').innerHTML=[1,2,3,4,5].map(x=>`<button onclick="rate(${x})">${x<=n?'★':'☆'}</button>`).join('')}function save(){if(!rating)return alert('Rating দিন');let reviews=JSON.parse(localStorage.getItem('asa_reviews')||'[]');reviews.push({order:oid,rating,text:document.getElementById('text').value,date:new Date().toISOString()});localStorage.setItem('asa_reviews',JSON.stringify(reviews));document.getElementById('done').innerHTML='<p>✅ আপনার Review & Rating সংরক্ষণ হয়েছে।</p>'}</script><nav class="bottom-nav"><a href="index.html">⌂<small>Home</small></a><a href="messages.html">💬<small>Messages</small></a><a href="checkout.html">🛒<small>Cart</small></a><a href="account.html">♙<small>Account</small></a></nav><script>loadASASettings().then(s=>{document.querySelectorAll(".logo").forEach(x=>x.src=s.logo||x.src);document.querySelectorAll(".bottom-nav small").forEach((x,i)=>x.textContent=[s.homeLabel,s.messagesNav,s.cartNav,s.accountNav][i]||x.textContent);let d=document.getElementById("deliveryDhaka");if(d)d.textContent=s.deliveryDhaka;let o=document.getElementById("deliveryOutside");if(o)o.textContent=s.deliveryOutside})</script></body></html>
