<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - ASA Fashion</title>
<style>body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f6f6f6;margin:0}.box{max-width:650px;margin:20px auto;background:#fff;padding:20px;border-radius:16px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px}button{border:0;padding:12px 16px;border-radius:10px;background:#111;color:#fff;font-weight:700}.qty button{padding:5px 10px}.danger{background:#b11}</style><style>.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:99}.bottom-nav a{text-decoration:none;color:#777;text-align:center;font-size:24px;padding-top:7px}.bottom-nav small{display:block;font-size:11px}.bottom-nav a:hover{color:#e66}</style><script src="asa-settings.js"></script></head><body><div class="box"><p><a href="index.html">← Home</a> &nbsp; | &nbsp; <a href="account.html">👤 My Account</a></p><h2>🧾 Checkout</h2><div id="items"></div><h3 id="total"></h3><p>🚚 ঢাকা: ৳100 | ঢাকার বাইরে: ৳250</p><label>নাম</label><input id="name" required><label>ফোন</label><input id="phone" required><label>জেলা</label><input id="district" required><label>এলাকা</label><input id="area" required><label>সম্পূর্ণ ঠিকানা</label><textarea id="address" rows="3"></textarea><label>নোট</label><textarea id="notes" rows="2"></textarea><p>💵 Payment: Cash on Delivery</p><button onclick="order()">📲 WhatsApp-এ অর্ডার করুন</button> <button onclick="location.href='index.html'">← Shopping</button></div>
<script type="module">
import {auth,db,doc,setDoc,serverTimestamp} from './firebase-config.js';
window.saveOrderToFirestore=async function(order){
  const user=auth.currentUser;
  if(!user) return {saved:false,reason:'not-signed-in'};
  const orderId=String(order.id);
  await setDoc(doc(db,'orders',orderId),{
    ...order,
    id:orderId,
    uid:user.uid,
    createdAt:serverTimestamp(),
    updatedAt:serverTimestamp()
  });
  return {saved:true};
};
</script>
<script>
const products=[{"id":1,"name":"Premium Saree Collection","category":"শাড়ি","price":1250,"oldPrice":0,"image":"","description":""},{"id":2,"name":"Elegant Designer Saree","category":"শাড়ি","price":1450,"oldPrice":0,"image":"","description":""},{"id":3,"name":"Stylish Three Piece","category":"থ্রি-পিস","price":990,"oldPrice":0,"image":"","description":""},{"id":4,"name":"Premium Three Piece","category":"থ্রি-পিস","price":1250,"oldPrice":0,"image":"","description":""},{"id":5,"name":"Elegant Burqa","category":"বোরকা","price":1100,"oldPrice":0,"image":"","description":""},{"id":6,"name":"Premium Abaya","category":"আবায়া","price":1450,"oldPrice":0,"image":"","description":""},{"id":7,"name":"Premium Panjabi","category":"পাঞ্জাবি","price":850,"oldPrice":0,"image":"","description":""},{"id":8,"name":"Stylish Panjabi","category":"পাঞ্জাবি","price":1050,"oldPrice":0,"image":"","description":""},{"id":9,"name":"Classic Men's Shirt","category":"শার্ট","price":750,"oldPrice":0,"image":"","description":""},{"id":10,"name":"Premium Polo Shirt","category":"পোলো শার্ট","price":650,"oldPrice":0,"image":"","description":""},{"id":11,"name":"Comfortable T-Shirt","category":"টি-শার্ট","price":450,"oldPrice":0,"image":"","description":""},{"id":12,"name":"Men's Jeans","category":"জিন্স","price":950,"oldPrice":0,"image":"","description":""},{"id":13,"name":"Formal Pant","category":"ফরমাল প্যান্ট","price":850,"oldPrice":0,"image":"","description":""},{"id":14,"name":"Women's Kurti","category":"কুর্তি","price":750,"oldPrice":0,"image":"","description":""},{"id":15,"name":"Stylish Gown","category":"গাউন","price":1350,"oldPrice":0,"image":"","description":""},{"id":16,"name":"Modern Lehenga","category":"লেহেঙ্গা","price":1850,"oldPrice":0,"image":"","description":""},{"id":17,"name":"Premium Hijab","category":"হিজাব","price":350,"oldPrice":0,"image":"","description":""},{"id":18,"name":"Baby Dress Set","category":"বেবি ড্রেস","price":650,"oldPrice":0,"image":"","description":""},{"id":19,"name":"Girls Frock","category":"ফ্রক","price":750,"oldPrice":0,"image":"","description":""},{"id":20,"name":"Kids Panjabi Set","category":"বাচ্চাদের পাঞ্জাবি","price":700,"oldPrice":0,"image":"","description":""},{"id":21,"name":"Kids T-Shirt","category":"বাচ্চাদের টি-শার্ট","price":350,"oldPrice":0,"image":"","description":""},{"id":22,"name":"Kids Jeans","category":"বাচ্চাদের জিন্স","price":650,"oldPrice":0,"image":"","description":""},{"id":23,"name":"Fashion Handbag","category":"ব্যাগ","price":850,"oldPrice":0,"image":"","description":""},{"id":24,"name":"Ladies Vanity Bag","category":"ভ্যানিটি ব্যাগ","price":950,"oldPrice":0,"image":"","description":""},{"id":25,"name":"Fashion Watch","category":"ঘড়ি","price":650,"oldPrice":0,"image":"","description":""},{"id":26,"name":"Stylish Sunglasses","category":"সানগ্লাস","price":450,"oldPrice":0,"image":"","description":""},{"id":27,"name":"Fashion Necklace","category":"নেকলেস","price":550,"oldPrice":0,"image":"","description":""},{"id":28,"name":"Bracelet","category":"ব্রেসলেট","price":350,"oldPrice":0,"image":"","description":""}],cart=JSON.parse(localStorage.getItem('asa_cart')||'[]');let delivery=100;
function render(){let sum=0;document.getElementById('items').innerHTML=cart.map(x=>{let p=products.find(a=>a.id===x.id);if(!p)return '';let t=p.price*x.qty;sum+=t;return `<div class="row"><span>${p.name} × ${x.qty}</span><span><b>৳${t}</b> <button class="danger" onclick="removeItem(${x.id})">🗑️ Delete</button></span></div>`}).join('');document.getElementById('total').textContent='মোট পণ্য মূল্য: ৳'+sum+' + Delivery';}
function removeItem(id){const i=cart.findIndex(x=>x.id===id);if(i>=0){cart.splice(i,1);localStorage.setItem('asa_cart',JSON.stringify(cart));render();}}
async function order(){if(!cart.length)return alert('Cart খালি');let n=document.getElementById('name').value,ph=document.getElementById('phone').value,d=document.getElementById('district').value,a=document.getElementById('area').value,ad=document.getElementById('address').value;if(!n||!ph||!d||!a||!ad)return alert('সব প্রয়োজনীয় তথ্য দিন');let text='ASA Fashion Collection BD%0Aঅর্ডার%0A%0A';cart.forEach(x=>{let p=products.find(a=>a.id===x.id);text+=encodeURIComponent(p.name)+' x '+x.qty+' = ৳'+(p.price*x.qty)+'%0A'});const sum=cart.reduce((s,x)=>{let p=products.find(a=>a.id===x.id);return s+(p?p.price*x.qty:0)},0);let orders=JSON.parse(localStorage.getItem('asa_orders')||'[]');orders.push({id:Date.now(),items:cart.map(x=>{let p=products.find(a=>a.id===x.id);return {id:x.id,name:p?p.name:'Product',qty:x.qty}}),total:sum+delivery,name:n,phone:ph,district:d,area:a,address:ad,status:'To Ship'});localStorage.setItem('asa_orders',JSON.stringify(orders));
const savedOrder=orders[orders.length-1];
if(window.saveOrderToFirestore){try{await window.saveOrderToFirestore(savedOrder);}catch(e){console.warn('Firestore order save failed',e);}}
text+=`%0Aনাম: ${encodeURIComponent(n)}%0Aফোন: ${encodeURIComponent(ph)}%0Aজেলা: ${encodeURIComponent(d)}%0Aএলাকা: ${encodeURIComponent(a)}%0Aঠিকানা: ${encodeURIComponent(ad)}%0Aনোট: ${encodeURIComponent(document.getElementById('notes').value)}%0APayment: Cash on Delivery`;localStorage.removeItem('asa_cart');location.href='https://wa.me/8801626201990?text='+text}
const u=JSON.parse(localStorage.getItem('asa_user')||'null');if(u){document.getElementById('name').value=u.name||'';document.getElementById('phone').value=u.phone||'';}render();

fetch('products.json?'+Date.now()).then(r=>r.json()).then(x=>{if(Array.isArray(x)){products.splice(0,products.length,...x);render()}}).catch(()=>{});
</script><nav class="bottom-nav"><a href="index.html">⌂<small>Home</small></a><a href="messages.html">💬<small>Messages</small></a><a href="checkout.html">🛒<small>Cart</small></a><a href="account.html">♙<small>Account</small></a></nav><script>loadASASettings().then(s=>{document.querySelectorAll(".logo").forEach(x=>x.src=s.logo||x.src);document.querySelectorAll(".bottom-nav small").forEach((x,i)=>x.textContent=[s.homeLabel,s.messagesNav,s.cartNav,s.accountNav][i]||x.textContent);let d=document.getElementById("deliveryDhaka");if(d)d.textContent=s.deliveryDhaka;let o=document.getElementById("deliveryOutside");if(o)o.textContent=s.deliveryOutside})</script></body></html>
