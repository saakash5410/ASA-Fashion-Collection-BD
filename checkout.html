<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7f0b38"><title>Checkout - ASA Fashion Collection BD</title><link rel="stylesheet" href="asa-premium.css"><script src="asa-core.js"></script><script src="asa-settings.js"></script></head><body><main class="wrap section"><div class="box" style="max-width:850px;margin:auto"><p><a href="index.html">← Home</a> | <a href="shop.html">Shop</a> | <a href="account.html">👤 Account</a></p><h1>🧾 Checkout</h1><div id="items"></div><div class="grid2"><div><label>নাম *</label><input id="name" required><label>ফোন *</label><input id="phone" inputmode="tel" placeholder="01XXXXXXXXX" required><label>বিভাগ *</label><select id="division" required><option value="">Select</option><option>ঢাকা</option><option>চট্টগ্রাম</option><option>রাজশাহী</option><option>খুলনা</option><option>বরিশাল</option><option>সিলেট</option><option>রংপুর</option><option>ময়মনসিংহ</option></select><label>জেলা *</label><input id="district" required><label>এলাকা/থানা *</label><input id="area" required><label>সম্পূর্ণ ঠিকানা *</label><textarea id="address" rows="3" required></textarea></div><div><h3>💳 Payment</h3><label><input type="radio" name="payment" value="COD" checked> Cash on Delivery</label><label><input type="radio" name="payment" value="bKash"> bKash</label><label><input type="radio" name="payment" value="Nagad"> Nagad</label><div id="payInfo" class="infoBox" style="display:none">Payment করলে Transaction ID লিখুন। এটি কোনো automatic payment gateway নয়; অর্ডার যাচাই করে কনফার্ম করা হবে।<input id="trx" placeholder="Transaction ID"></div><label>Coupon</label><div style="display:flex;gap:8px"><input id="coupon" placeholder="WELCOME10 / SAVE100 / FREESHIP"><button type="button" onclick="applyCoupon()">Apply</button></div><p id="couponMsg" class="muted"></p><div class="row"><span>Subtotal</span><b id="subtotal">৳0</b></div><div class="row"><span>Delivery</span><b id="delivery">৳100</b></div><div class="row"><span>Discount</span><b id="discount">৳0</b></div><div class="row"><span>Total</span><b id="total">৳0</b></div></div></div><label>Order Note</label><textarea id="notes" rows="2" placeholder="Optional"></textarea><button class="btn" onclick="order()">✅ Place Order</button> <button class="btn light" onclick="location.href='shop.html'">Continue Shopping</button><p class="muted">📞 01626201990 • WhatsApp order support available</p></div></main><script>let cart=ASA.getCart(),settings={deliveryDhaka:100,deliveryOutside:250};function sub(){return cart.reduce((a,x)=>a+(+x.price||0)*(+x.qty||0),0)}function render(){document.getElementById('items').innerHTML=cart.length?cart.map(x=>`<div class="row"><span>${ASA.escape(x.name)} × ${x.qty}${x.size?' • '+x.size:''}${x.color?' • '+x.color:''}</span><b>${ASA.money(x.price*x.qty)}</b></div>`).join(''):'<p>Cart খালি</p>';let subtotal=sub(),free=ASA.getCoupon()?.freeShipping;let div=document.getElementById('division').value;let delivery=div==='ঢাকা'?+settings.deliveryDhaka:+settings.deliveryOutside;if(free)delivery=0;let c=ASA.getCoupon();let discount=c?.discount||0;document.getElementById('subtotal').textContent=ASA.money(subtotal);document.getElementById('delivery').textContent=ASA.money(delivery);document.getElementById('discount').textContent=ASA.money(discount);document.getElementById('total').textContent=ASA.money(Math.max(0,subtotal+delivery-discount));}function applyCoupon(){let c=ASA.applyCoupon(document.getElementById('coupon').value,sub());document.getElementById('couponMsg').textContent=c?`Coupon ${c.code} applied`: 'Coupon invalid বা minimum order পূরণ হয়নি';render()}document.querySelectorAll('input[name=payment]').forEach(r=>r.onchange=()=>document.getElementById('payInfo').style.display=r.checked&&r.value!=='COD'?'block':'none');document.getElementById('division').onchange=render;loadASASettings().then(s=>{settings=s||settings;render()});function order(){if(!cart.length)return alert('Cart খালি');let ids=['name','phone','division','district','area','address'];if(ids.some(id=>!document.getElementById(id).value.trim()))return alert('সব * তথ্য দিন');let payment=document.querySelector('input[name=payment]:checked').value,trx=document.getElementById('trx').value.trim();if(payment!=='COD'&&!trx)return alert('Transaction ID দিন');let subtotal=sub(),c=ASA.getCoupon(),delivery=document.getElementById('division').value==='ঢাকা'?+settings.deliveryDhaka:+settings.deliveryOutside;if(c?.freeShipping)delivery=0;let discount=c?.discount||0,total=Math.max(0,subtotal+delivery-discount),id='ASA'+Date.now().toString().slice(-8);let o={id,uid:window.firebaseAuth?.currentUser?.uid||null,items:cart,subtotal,delivery,discount,total,coupon:c?.code||'',payment,trx,name:document.getElementById('name').value,phone:document.getElementById('phone').value,division:document.getElementById('division').value,district:document.getElementById('district').value,area:document.getElementById('area').value,address:document.getElementById('address').value,notes:document.getElementById('notes').value,status:'Pending',createdAt:new Date().toISOString()};let os=JSON.parse(localStorage.getItem('asa_orders')||'[]');os.push(o);localStorage.setItem('asa_orders',JSON.stringify(os));if(window.saveOrderToFirestore)saveOrderToFirestore(o).catch(console.warn);ASA.setCart([]);ASA.clearCoupon();let wa=`https://wa.me/${ASA.wa}?text=${encodeURIComponent('ASA Fashion Collection BD
Order ID: '+id+'
Name: '+o.name+'
Phone: '+o.phone+'
Address: '+o.address+'
Payment: '+payment+'
Total: ৳'+total)}`;location.href=wa}</script></body></html>
