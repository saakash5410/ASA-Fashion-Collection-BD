<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages & Contact - ASA Fashion Collection BD</title><link rel="stylesheet" href="asa-premium.css"><script src="asa-core.js"></script><style>
.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:760px;margin:18px auto}.contact-card{display:block;text-decoration:none;color:#222;background:#fff;border:1px solid #eee;border-radius:16px;padding:18px;box-shadow:0 4px 16px #0000000d}.contact-card b{display:block;font-size:18px;margin-bottom:5px}.contact-card span{color:#777;font-size:13px}.contact-card .ci{font-size:30px;margin-bottom:8px}.message-list{max-width:760px;margin:18px auto}.mcard{background:#fff;border-radius:14px;padding:14px;margin:10px 0;border-left:4px solid #e66d22;box-shadow:0 2px 12px #0001}.unread{background:#fff8ef}.muted{color:#777}.topline{display:flex;justify-content:space-between;gap:10px}.tabbar{display:flex;gap:8px;overflow:auto;padding:8px 0}.tabbar button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 14px}.tabbar button.active{background:#111;color:#fff}.actions{text-align:right}.mark{border:0;background:#eee;border-radius:10px;padding:8px 12px}</style><script src="asa-2026.js"></script></head><body><header class="header"><div class="wrap"><div class="head"><a href="index.html"><img class="logo" src="logo.jpg"></a><a class="btn" href="shop.html">Shop</a></div></div></header><main class="wrap section"><h1>💬 Messages & Contact</h1><p class="muted">ASA Fashion Collection BD-এর সাথে সরাসরি যোগাযোগ করুন</p><div class="contact-grid">
<a class="contact-card" href="https://m.me/asafashioncollectionbd" target="_blank"><div class="ci">💬</div><b>Messenger</b><span>Facebook Messenger-এ চ্যাট করুন</span></a>
<a class="contact-card" href="https://wa.me/8801626201990" target="_blank"><div class="ci">🟢</div><b>WhatsApp</b><span>01626201990</span></a>
<a class="contact-card" href="tel:+8801626201990"><div class="ci">📞</div><b>Phone</b><span>01626201990</span></a>
<a class="contact-card" href="https://www.facebook.com/asafashioncollectionbd" target="_blank"><div class="ci">📘</div><b>Facebook</b><span>ASA Fashion Collection BD</span></a>
<a class="contact-card" href="mailto:ridoyh.akash7@gmail.com"><div class="ci">✉️</div><b>Email</b><span>Send us an email</span></a>
</div><div class="actions"><button class="mark" id="markAll">🧹 Mark all as read</button></div><div class="tabbar"><button class="active" data-type="all">All</button><button data-type="chat">Chats</button><button data-type="order">Orders</button><button data-type="alert">Alerts</button><button data-type="promo">Promos</button></div><div id="list" class="message-list"><p class="muted">Login করলে আপনার messages এখানে দেখা যাবে।</p></div></main><script type="module">
import {auth,db,onAuthStateChanged,doc,setDoc,getDoc,serverTimestamp} from './firebase-config.js';
import {collection,query,where,orderBy,onSnapshot,updateDoc,getDocs} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
let all=[],filter='all',unsub=null;const list=document.getElementById('list');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){let a=filter==='all'?all:all.filter(x=>x.type===filter);if(!a.length){list.innerHTML='<p class="muted">কোনো message নেই।</p>';return}list.innerHTML=a.map(x=>`<div class="mcard ${x.read?'':'unread'}"><div class="topline"><b>${esc(x.title||'Message')}</b><small>${x.read?'Read':'Unread'}</small></div><p>${esc(x.text||'')}</p>${x.orderId?`<small>Order: ${esc(x.orderId)}</small>`:''}</div>`).join('')}
function subscribe(uid){if(unsub)unsub();const q=query(collection(db,'messages'),where('userId','==',uid),orderBy('createdAt','desc'));unsub=onSnapshot(q,s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{list.innerHTML='<p class="muted">Messages load হয়নি। Firestore Rules/Index চেক করুন।</p>'})}
onAuthStateChanged(auth,u=>{if(u)subscribe(u.uid);else{all=[];render()}});
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.type;render()});
document.getElementById('markAll').onclick=async()=>{const u=auth.currentUser;if(!u)return alert('আগে Login করুন');const a=all.filter(x=>!x.read);await Promise.all(a.map(x=>updateDoc(doc(db,'messages',x.id),{read:true})));};
</script></body></html>
