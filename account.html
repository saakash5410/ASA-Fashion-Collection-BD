<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account - ASA Fashion</title><style>body{margin:0;background:#f5f5f5;font-family:Arial,"Noto Sans Bengali",sans-serif}.box{max-width:650px;margin:25px auto;background:#fff;padding:22px;border-radius:18px}.profile{display:flex;gap:15px;align-items:center;border-bottom:1px solid #eee;padding-bottom:18px}.avatar{width:62px;height:62px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px}.card{background:#f7f7f7;padding:15px;border-radius:12px;margin-top:15px}button,a.btn{display:inline-block;padding:11px 15px;border:0;border-radius:10px;background:#111;color:#fff;text-decoration:none;font-weight:700;margin:5px 4px 0 0}.logout{background:#b11}input{padding:11px;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px}</style><style>.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:99}.bottom-nav a{text-decoration:none;color:#777;text-align:center;font-size:24px;padding-top:7px}.bottom-nav small{display:block;font-size:11px}.bottom-nav a:hover{color:#e66}</style></head><body><div class="box"><div class="profile"><div class="avatar">👤</div><div><h2 id="name">Customer</h2><div id="phone"></div></div></div><div class="card"><h3>👤 My Account</h3><p>আপনার account এই ফোনে সংরক্ষিত আছে। এখান থেকে Shopping বা Checkout করতে পারবেন।</p><a class="btn" href="index.html">🛍️ Shopping</a><a class="btn" href="checkout.html">🧾 Checkout</a><button class="logout" onclick="logout()">Logout</button></div><div class="card"><h3>📦 Order History</h3><p id="orders">এখনও কোনো order history নেই।</p></div></div><script>const u=JSON.parse(localStorage.getItem('asa_user')||'null');if(!u)location.href='login.html';else{document.getElementById('name').textContent=u.name||'Customer';document.getElementById('phone').textContent=u.phone||''}function logout(){localStorage.removeItem('asa_user');location.href='index.html'}</script><nav class="bottom-nav"><a href="index.html">⌂<small>Home</small></a><a href="messages.html">💬<small>Messages</small></a><a href="checkout.html">🛒<small>Cart</small></a><a href="account.html">♙<small>Account</small></a></nav></body></html>
