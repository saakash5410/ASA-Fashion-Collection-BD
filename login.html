<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login - ASA Fashion</title><style>body{margin:0;background:#f5f5f5;font-family:Arial,"Noto Sans Bengali",sans-serif}.box{max-width:430px;margin:30px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 25px #0001}.logo{width:80px;height:80px;border-radius:18px;display:block;margin:auto}.center{text-align:center}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #ddd;border-radius:10px;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;font-size:15px;margin-top:5px}.google{background:#fff;color:#222;border:1px solid #ddd}.switch{margin-top:15px;text-align:center;color:#666}.link{color:#111;font-weight:700;cursor:pointer}.error{color:#c00;min-height:20px}.ok{color:#087f46;min-height:20px}a{color:#111}</style><script src="asa-settings.js"></script></head><body><div class="box"><div class="center"><img class="logo" src="logo.jpg"><h2>ASA Fashion Collection BD</h2><p id="title">Customer Login</p></div><div id="error" class="error"></div><div id="nameWrap" style="display:none"><label>নাম</label><input id="name" placeholder="আপনার নাম"></div><div id="phoneWrap" style="display:none"><label>মোবাইল নম্বর</label><input id="phone" type="tel" placeholder="01XXXXXXXXX"></div><label>Email</label><input id="email" type="email" placeholder="example@gmail.com" autocomplete="email"><label>পাসওয়ার্ড</label><input id="password" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"><button id="submit">Login</button><button class="google" id="google">🔵 Continue with Google</button><p class="center"><span class="link" id="forgot">Forgot Password?</span></p><div class="switch"><span id="toggleText">নতুন কাস্টমার?</span> <span class="link" id="toggle">Create Account</span></div><p class="center"><a href="index.html">← Shopping-এ ফিরে যান</a></p></div>
<script type="module">
import {auth,db,googleProvider,signInWithPopup,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,updateProfile,doc,setDoc,serverTimestamp} from './firebase-config.js';
let signup=false; const $=id=>document.getElementById(id); const err=(m,ok=false)=>{ $('error').className=ok?'ok':'error'; $('error').textContent=m; };
function validPhone(p){return !p || /^01\d{9}$/.test(p)}
async function saveProfile(user, extra={}){await setDoc(doc(db,'customers',user.uid),{uid:user.uid,name:user.displayName||extra.name||'',email:user.email||extra.email||'',phone:extra.phone||'',photoURL:user.photoURL||'',lastLogin:serverTimestamp(),updatedAt:serverTimestamp(),createdAt:extra.createdAt||serverTimestamp()},{merge:true});}
$('toggle').onclick=()=>{signup=!signup;$('title').textContent=signup?'Create Customer Account':'Customer Login';$('submit').textContent=signup?'Create Account':'Login';$('nameWrap').style.display=signup?'block':'none';$('phoneWrap').style.display=signup?'block':'none';$('toggleText').textContent=signup?'আগে থেকেই account আছে?':'নতুন কাস্টমার?';$('toggle').textContent=signup?'Login':'Create Account';$('password').autocomplete=signup?'new-password':'current-password';err('')};
$('submit').onclick=async()=>{try{err('');const email=$('email').value.trim(),pw=$('password').value,name=$('name').value.trim(),phone=$('phone').value.trim();if(!/^\S+@\S+\.\S+$/.test(email))return err('সঠিক Email দিন');if(pw.length<6)return err('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে');if(signup){if(!name)return err('নাম দিন');if(!validPhone(phone))return err('সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন');const c=await createUserWithEmailAndPassword(auth,email,pw);await updateProfile(c.user,{displayName:name});await saveProfile(c.user,{name,email,phone});localStorage.setItem('asa_user',JSON.stringify({uid:c.user.uid,name,email,phone}));location.href='account.html';}else{const c=await signInWithEmailAndPassword(auth,email,pw);await saveProfile(c.user);localStorage.setItem('asa_user',JSON.stringify({uid:c.user.uid,name:c.user.displayName||'',email:c.user.email||'',phone:''}));location.href='account.html';}}catch(e){console.error(e);const map={'auth/invalid-credential':'Email বা পাসওয়ার্ড ভুল','auth/email-already-in-use':'এই Email দিয়ে account আগে থেকেই আছে','auth/weak-password':'আরও শক্তিশালী password দিন','auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন'};err(map[e.code]||'Login/Account তৈরি করা যায়নি: '+e.message)}};
$('google').onclick=async()=>{try{err('');const c=await signInWithPopup(auth,googleProvider);await saveProfile(c.user);localStorage.setItem('asa_user',JSON.stringify({uid:c.user.uid,name:c.user.displayName||'',email:c.user.email||'',phone:''}));location.href='account.html';}catch(e){console.error(e);err('Google Login করা যায়নি: '+e.message)}};
$('forgot').onclick=async()=>{try{err('');const email=$('email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email))return err('আগে Email লিখুন');await sendPasswordResetEmail(auth,email,{url:'https://saakash5410.github.io/ASA-Fashion-Collection-BD/login.html',handleCodeInApp:false});err('Password reset email পাঠানো হয়েছে। আপনার Email inbox/spam দেখুন।',true);}catch(e){console.error(e);err('Reset email পাঠানো যায়নি: '+e.message)}};
loadASASettings().then(s=>{document.querySelectorAll('.logo').forEach(x=>x.src=s.logo||x.src)});
</script></body></html>
