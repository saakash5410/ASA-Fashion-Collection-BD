<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login - ASA Fashion</title><style>body{margin:0;background:#f5f5f5;font-family:Arial,"Noto Sans Bengali",sans-serif}.box{max-width:430px;margin:45px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 25px #0001}.logo{width:80px;height:80px;border-radius:18px;display:block;margin:auto}.center{text-align:center}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #ddd;border-radius:10px;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;font-size:15px}.switch{margin-top:15px;text-align:center;color:#666}.link{color:#111;font-weight:700;cursor:pointer}.error{color:#c00;min-height:20px}a{color:#111}</style><script src="asa-settings.js"></script></head><body><div class="box"><div class="center"><img class="logo" src="logo.jpg"><h2>ASA Fashion Collection BD</h2><p id="title">Customer Login</p></div><div id="error" class="error"></div><label>মোবাইল নম্বর</label><input id="phone" type="tel" placeholder="01XXXXXXXXX"><div id="nameWrap" style="display:none"><label>নাম</label><input id="name" placeholder="আপনার নাম"></div><label>পাসওয়ার্ড</label><input id="password" type="password" placeholder="পাসওয়ার্ড"><button id="submit">Login</button><div class="switch"><span id="toggleText">নতুন কাস্টমার?</span> <span class="link" id="toggle">Create Account</span></div><p class="center"><a href="index.html">← Shopping-এ ফিরে যান</a></p></div><script>let signup=false;const $=id=>document.getElementById(id);$('toggle').onclick=()=>{signup=!signup;$('title').textContent=signup?'Create Customer Account':'Customer Login';$('submit').textContent=signup?'Create Account':'Login';$('nameWrap').style.display=signup?'block':'none';$('toggleText').textContent=signup?'আগে থেকেই account আছে?':'নতুন কাস্টমার?';$('toggle').textContent=signup?'Login':'Create Account';$('error').textContent=''};$('submit').onclick=()=>{const phone=$('phone').value.trim(),pw=$('password').value,name=$('name').value.trim();if(!/^01\d{9}$/.test(phone))return $('error').textContent='সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন';if(pw.length<6)return $('error').textContent='পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে';let users=JSON.parse(localStorage.getItem('asa_users')||'{}');if(signup){if(!name)return $('error').textContent='নাম দিন';if(users[phone])return $('error').textContent='এই নম্বর দিয়ে account আছে';users[phone]={name,phone,password:pw};localStorage.setItem('asa_users',JSON.stringify(users));localStorage.setItem('asa_user',JSON.stringify(users[phone]));location.href='account.html'}else{if(!users[phone]||users[phone].password!==pw)return $('error').textContent='মোবাইল নম্বর বা পাসওয়ার্ড ভুল';localStorage.setItem('asa_user',JSON.stringify(users[phone]));location.href='account.html'}};</script><script>loadASASettings().then(s=>{document.querySelectorAll(".logo").forEach(x=>x.src=s.logo||x.src);document.querySelectorAll(".bottom-nav small").forEach((x,i)=>x.textContent=[s.homeLabel,s.messagesNav,s.cartNav,s.accountNav][i]||x.textContent);let d=document.getElementById("deliveryDhaka");if(d)d.textContent=s.deliveryDhaka;let o=document.getElementById("deliveryOutside");if(o)o.textContent=s.deliveryOutside})</script></body></html>
