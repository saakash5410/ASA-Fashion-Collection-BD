<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - ASA Fashion Collection BD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8f9ff,#fff);font-family:Arial,"Noto Sans Bengali",sans-serif;color:#172554}.box{max-width:440px;margin:28px auto;padding:24px 22px 30px;background:#fff;min-height:calc(100vh - 56px);border-radius:24px;box-shadow:0 10px 35px #00000010}.logo{width:86px;height:86px;border-radius:20px;display:block;margin:8px auto 12px}.center{text-align:center}.brand{font-size:25px;margin:0 0 4px;color:#111}.tag{margin:0 0 22px;color:#334155;font-size:16px}.social{width:100%;padding:14px 16px;margin:7px 0;border:1px solid #e5e7eb;border-radius:12px;background:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}.social.google{box-shadow:0 3px 12px #00000008}.gicon{font-size:22px;font-weight:900}.ficon{background:#1877f2;color:#fff;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-family:Arial}.or{display:flex;align-items:center;gap:10px;margin:18px 0;color:#64748b}.or:before,.or:after{content:"";height:1px;background:#dbe3f0;flex:1}.tabs{display:flex;justify-content:center;margin:4px 0 15px;border-bottom:1px solid #e5e7eb}.tab{padding:10px 14px;border:0;background:none;color:#1d4ed8;font-size:15px;font-weight:700;cursor:pointer}.tab.active{border-bottom:3px solid #1d4ed8}.field{position:relative;margin:9px 0}.field input{width:100%;padding:14px 44px 14px 42px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.ico{position:absolute;left:14px;top:13px;font-size:19px}.eye{position:absolute;right:12px;top:11px;border:0;background:none;font-size:19px;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:14px}.remember{display:flex;align-items:center;gap:7px}.remember input{width:auto}.link{color:#1d4ed8;font-weight:700;cursor:pointer}.mainbtn{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.signup{margin:20px 0 4px;text-align:center;color:#64748b}.back{text-align:center;margin-top:18px}.back a{color:#111;font-weight:700;text-decoration:none}.error{min-height:20px;color:#dc2626;text-align:center;font-size:14px;margin:5px 0}.hint{font-size:12px;color:#64748b;text-align:center;margin-top:10px;line-height:1.5}
</style></head>
<body><div class="box">
<img class="logo" src="logo.jpg" alt="ASA Fashion">
<div class="center"><h1 class="brand">ASA Fashion Collection BD</h1><p class="tag">Discover the endless possibilities</p></div>
<button class="social google" id="google"><span class="gicon">G</span> Log in with Google</button>
<button class="social" id="facebook"><span class="ficon">f</span> Log in with Facebook</button>
<div class="or">OR</div>
<div class="tabs"><button class="tab active" id="passTab">🔑 Via Password</button><button class="tab" id="mobileTab">📱 Mobile Number</button></div>
<div id="error" class="error"></div>
<div id="loginMode">
<div class="field"><span class="ico">📱</span><input id="phone" type="tel" inputmode="numeric" placeholder="Mobile Number"></div>
<div class="field"><span class="ico">🔒</span><input id="password" type="password" placeholder="Password"><button class="eye" id="eye">👁️</button></div>
<div class="row"><label class="remember"><input id="remember" type="checkbox"> Remember me</label><span class="link" id="forgot">Forgot Password?</span></div>
<button class="mainbtn" id="submit">Log In</button>
</div>
<div class="signup">Haven't Signed Up Yet? <span class="link" id="signup">Sign up Now →</span></div>
<p class="hint">Google/Facebook-এর আসল OAuth login চালাতে Firebase/secure backend সংযোগ প্রয়োজন।</p>
<div class="back"><a href="index.html">← Shopping-এ ফিরে যান</a></div>
</div>
<script>
const $=id=>document.getElementById(id);let mobileOnly=false;
$('eye').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password'};
function validPhone(p){return /^01\d{9}$/.test(p)}
$('passTab').onclick=()=>{mobileOnly=false;$('passTab').classList.add('active');$('mobileTab').classList.remove('active');$('password').style.display='block';$('eye').style.display='block';$('forgot').style.display='inline'};
$('mobileTab').onclick=()=>{mobileOnly=true;$('mobileTab').classList.add('active');$('passTab').classList.remove('active');$('password').style.display='none';$('eye').style.display='none';$('forgot').style.display='none'};
$('google').onclick=()=>alert('Google Login চালু করতে Firebase/Google OAuth সেটআপ করতে হবে।');
$('facebook').onclick=()=>alert('Facebook Login চালু করতে Facebook OAuth + secure backend সেটআপ করতে হবে।');
$('signup').onclick=()=>{location.href='login.html?signup=1'};
$('submit').onclick=()=>{const phone=$('phone').value.trim(),pw=$('password').value; if(!validPhone(phone))return $('error').textContent='সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন';let users=JSON.parse(localStorage.getItem('asa_users')||'{}');if(mobileOnly){if(!users[phone])return $('error').textContent='এই নম্বর দিয়ে account পাওয়া যায়নি';localStorage.setItem('asa_user',JSON.stringify(users[phone]));return location.href='account.html'}if(!users[phone]||users[phone].password!==pw)return $('error').textContent='মোবাইল নম্বর বা পাসওয়ার্ড ভুল';localStorage.setItem('asa_user',JSON.stringify(users[phone]));if($('remember').checked)localStorage.setItem('asa_remember',phone);location.href='account.html'};
$('forgot').onclick=()=>{const phone=prompt('আপনার ১১ সংখ্যার মোবাইল নম্বর দিন:');if(!phone)return;if(!validPhone(phone))return alert('সঠিক মোবাইল নম্বর দিন');let users=JSON.parse(localStorage.getItem('asa_users')||'{}');if(!users[phone])return alert('এই নম্বর দিয়ে account পাওয়া যায়নি');const np=prompt('নতুন পাসওয়ার্ড দিন (কমপক্ষে ৬ অক্ষর):');if(!np||np.length<6)return alert('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে');users[phone].password=np;localStorage.setItem('asa_users',JSON.stringify(users));alert('পাসওয়ার্ড পরিবর্তন হয়েছে। এখন Login করুন।')};
if(new URLSearchParams(location.search).get('signup')==='1'){document.querySelector('.brand').textContent='Create Account';$('submit').textContent='Create Account';$('loginMode').insertAdjacentHTML('afterbegin','<div class="field"><span class="ico">👤</span><input id="name" placeholder="আপনার নাম"></div>');$('submit').onclick=()=>{const name=$('name').value.trim(),phone=$('phone').value.trim(),pw=$('password').value;if(!name)return $('error').textContent='নাম দিন';if(!validPhone(phone))return $('error').textContent='সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন';if(pw.length<6)return $('error').textContent='পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে';let users=JSON.parse(localStorage.getItem('asa_users')||'{}');if(users[phone])return $('error').textContent='এই নম্বর দিয়ে account আছে';users[phone]={name,phone,password:pw};localStorage.setItem('asa_users',JSON.stringify(users));localStorage.setItem('asa_user',JSON.stringify(users[phone]));location.href='account.html'} }
</script></body></html>
