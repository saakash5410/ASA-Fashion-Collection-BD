<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders - ASA Fashion</title><style>body{margin:0;background:#f5f5f5;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#222}.box{max-width:700px;margin:18px auto 85px;background:#fff;padding:20px;border-radius:18px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:15px 0}.tabs a{background:#f1f1f1;padding:10px 4px;border-radius:10px;text-align:center;text-decoration:none;color:#333;font-size:12px}.order{border:1px solid #eee;border-radius:14px;padding:14px;margin:12px 0}.status{font-weight:700;margin:5px 0}.empty{text-align:center;padding:55px 10px;color:#777}button,a.btn{display:inline-block;padding:10px 14px;border:0;border-radius:10px;background:#111;color:#fff;text-decoration:none;font-weight:700}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:99}.bottom-nav a{text-decoration:none;color:#777;text-align:center;font-size:24px;padding-top:7px}.bottom-nav small{display:block;font-size:11px}</style><script src="asa-settings.js"></script></head><body><div class="box"><p><a href="account.html">← Account</a></p><h2>📦 My Orders</h2><div class="tabs"><a href="#all">View All Orders</a><a href="#pay">To Pay</a><a href="#ship">To Ship</a><a href="#receive">To Receive</a><a href="#review">To Review</a></div><div id="orders"></div><div class="card"><h3>↩️ Returns & Cancellations</h3><p>আপনার অর্ডারের return/cancellation তথ্য এখানে দেখতে পারবেন।</p><a class="btn" href="messages.html">Messages</a></div></div><script>const list=JSON.parse(localStorage.getItem('asa_orders')||'[]');const el=document.getElementById('orders');if(!list.length){el.innerHTML='<div class="empty">📦<h3>কোনো অর্ডার নেই</h3><p>আপনার অর্ডার এখানে দেখা যাবে।</p><a class="btn" href="index.html">Start Shopping</a></div>'}else{el.innerHTML=list.slice().reverse().map(o=>`<div class="order"><b>Order #${o.id}</b><div>${o.items.map(i=>i.name+' × '+i.qty).join('<br>')}</div><div>মোট: ৳${o.total}</div><div class="status">${o.status||'To Ship'}</div><a class="btn" href="reviews.html?order=${o.id}">Review / Ratings</a></div>`).join('')}</script><nav class="bottom-nav"><a href="index.html">⌂<small>Home</small></a><a href="messages.html">💬<small>Messages</small></a><a href="checkout.html">🛒<small>Cart</small></a><a href="account.html">♙<small>Account</small></a></nav><script>loadASASettings().then(s=>{document.querySelectorAll(".logo").forEach(x=>x.src=s.logo||x.src);document.querySelectorAll(".bottom-nav small").forEach((x,i)=>x.textContent=[s.homeLabel,s.messagesNav,s.cartNav,s.accountNav][i]||x.textContent);let d=document.getElementById("deliveryDhaka");if(d)d.textContent=s.deliveryDhaka;let o=document.getElementById("deliveryOutside");if(o)o.textContent=s.deliveryOutside})</script></body></html>
